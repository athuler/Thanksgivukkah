<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgivukkah Countdown</title>
<meta name="description" content="Countdown to the next time Thanksgiving and Hanukkah collide.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦃</text></svg>">
<!-- GA -->
<style>
  :root { --bg1:#f7d9a8; --bg2:#e8a25c; --ink:#3b1f0e; --accent:#1f4fa8; --card:#fff8ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg1:#2a1a10; --bg2:#14223f; --ink:#fbeedd; --accent:#8fb4ff; --card:#1d1410; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
  main { max-width: 40rem; width: 100%; }
  h1 { font-size: clamp(2.2rem, 9vw, 4.5rem); margin: 0 0 .25em; letter-spacing: -.02em; }
  .emoji { font-size: clamp(2.5rem, 12vw, 4.5rem); }
  .emoji span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .emoji span:last-child { animation: flicker 1.3s ease-in-out infinite alternate; }
  .count { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin: 1.5rem 0; }
  .count div { background: var(--card); border-radius: 14px; padding: .7rem .9rem; min-width: 5.2rem; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .count b { display: block; font-size: clamp(1.6rem, 7vw, 2.4rem); font-variant-numeric: tabular-nums; color: var(--accent); }
  .count small { text-transform: uppercase; font-size: .7rem; letter-spacing: .1em; }
  #s.tick { animation: tick .3s ease-out; }
  p { margin: .4rem 0; font-size: 1.05rem; }
  button { font: inherit; color: inherit; background: var(--card); border: 0; border-radius: 999px; padding: .5rem 1.1rem; margin-top: 1.2rem; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  dialog { width: min(30rem, 100%); max-height: min(36rem, 85vh); padding: 0; border: 0; border-radius: 22px; background: var(--card); color: var(--ink); box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(3px); }
  dialog header { display: flex; justify-content: space-between; align-items: center; padding: .8rem 1.1rem; font-weight: 700; }
  dialog header button { margin: 0; padding: .2rem .7rem; }
  #list { height: min(30rem, 72vh); overflow-y: auto; overscroll-behavior: contain; padding: 0 1rem; }
  .row { padding: 1rem 0; opacity: .6; border-top: 1px solid rgba(128,128,128,.2); }
  .row.next { opacity: 1; color: var(--accent); }
  .row h2 { margin: 0; font-size: 1.15rem; }
  .row p { font-size: .9rem; margin: .2rem 0 0; }
  .end { padding: 1rem 0; opacity: .6; font-size: .85rem; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }
  @keyframes flicker { from { filter: drop-shadow(0 0 2px gold); } to { filter: drop-shadow(0 0 14px orange); transform: scale(1.05); } }
  @keyframes tick { from { transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="emoji" aria-hidden="true"><span>🦃</span> <span>🕎</span></div>
  <h1>Thanksgivukkah</h1>
  <div class="count" role="timer" aria-live="off">
    <div><b id="y">–</b><small>years</small></div>
    <div><b id="d">–</b><small>days</small></div>
    <div><b id="h">–</b><small>hours</small></div>
    <div><b id="m">–</b><small>min</small></div>
    <div><b id="s">–</b><small>sec</small></div>
  </div>
  <p><strong>Next:</strong> <span id="next"></span></p>
  <p><strong>Last:</strong> <span id="last"></span></p>
  <button id="open">Every Thanksgivukkah ↕</button>
</main>
<dialog id="all" aria-label="Every Thanksgivukkah">
  <header>Every Thanksgivukkah <span><button id="today" hidden>↩ Today</button> <button id="close" aria-label="Close">✕</button></span></header>
  <div id="list"></div>
</dialog>
<script>
  const $ = id => document.getElementById(id);
  const DAY = 864e5, MIN = 1, MAX = 275759; // MAX: last full year a JS Date can hold
  const heb = new Intl.DateTimeFormat("en-u-ca-hebrew", { day: "numeric", month: "long", timeZone: "UTC" });
  const is25Kislev = d => { const p = Object.fromEntries(heb.formatToParts(d).map(x => [x.type, x.value])); return p.month === "Kislev" && p.day === "25"; };
  // setUTCFullYear because Date.UTC maps years 0-99 to 1900-1999
  const utc = (y, m, d, h = 0, mi = 0) => { const t = new Date(Date.UTC(2000, m, d, h, mi)); t.setUTCFullYear(y); return t; };

  // Thanksgivukkah = Hanukkah's first full day (25 Kislev) is Thanksgiving, or the day after (first candle on Thanksgiving night).
  // shortcut: applies today's 4th-Thursday rule to every year, even before Thanksgiving existed (1863).
  function thanksgivukkah(y) {
    const date = 22 + (11 - utc(y, 10, 1).getUTCDay()) % 7;
    const tg = utc(y, 10, date), eve = is25Kislev(utc(y, 10, date + 1));
    if (!eve && !is25Kislev(tg)) return null;
    // shortcut: first candle at 4:30pm US Eastern (21:30 UTC), not the viewer's local sunset.
    return { y, tg, start: utc(y, 10, eve ? date : date - 1, 21, 30) };
  }
  // shortcut: searching past 2165 scans ~76,000 empty years (~0.7s) in one go.
  function find(y, step) {
    for (; y >= MIN && y <= MAX; y += step) { const t = thanksgivukkah(y); if (t) return t; }
    return null;
  }
  console.assert(thanksgivukkah(2013) && thanksgivukkah(2070) && thanksgivukkah(2165) && !thanksgivukkah(2014), "Thanksgivukkah date math changed");

  const now = new Date(), yNow = now.getUTCFullYear();
  let next = find(yNow, 1);
  if (+next.start + 8 * DAY <= now) next = find(next.y + 1, 1); // this year's already over
  const last = find(next.y - 1, -1);
  const fmt = d => d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
  $("next").textContent = fmt(next.tg);
  $("last").textContent = fmt(last.tg);
  const NEXT = next.start;

  // Modal: starts on the next one, loads more as you scroll either way.
  const list = $("list");
  let lo = next.y, hi = next.y;
  function row(t) {
    const el = document.createElement("section"), d = t.y - yNow;
    el.className = "row" + (t === next ? " next" : "");
    const rel = t === next ? "Next one!" : d < 0 ? `${(-d).toLocaleString()} years ago` : d === 0 ? "This year" : `in ${d.toLocaleString()} years`;
    el.innerHTML = `<h2>${fmt(t.tg)}</h2><p>${rel}</p>`;
    return el;
  }
  const nextRow = list.appendChild(row(next));
  function end(text) { const el = document.createElement("div"); el.className = "end"; el.textContent = text; return el; }
  function more(dir) {
    for (let i = 0; i < 10; i++) {
      if (dir < 0 ? lo <= MIN : hi >= MAX) return;
      const t = find(dir < 0 ? lo - 1 : hi + 1, dir);
      if (dir < 0) {
        const h = list.scrollHeight;
        if (t) { lo = t.y; list.prepend(row(t)); } else { lo = MIN; list.prepend(end("Year 1. That's as far back as we go.")); }
        list.scrollTop += list.scrollHeight - h; // keep the view still while adding above
      } else if (t) { hi = t.y; list.append(row(t)); }
      else { hi = MAX; list.append(end("That's as far as JavaScript dates go. 🙃")); }
      if (!t) return;
    }
  }
  list.addEventListener("scroll", () => {
    if (list.scrollTop < 300) more(-1);
    if (list.scrollHeight - list.scrollTop - list.clientHeight < 300) more(1);
  });
  $("open").onclick = () => {
    if (lo === hi) { more(-1); more(1); } // filled on first open: the scan past 2165 is slow
    $("all").showModal(); nextRow.scrollIntoView({ block: "center" }); };
  // "Today" shows only while the next one is scrolled out of view
  new IntersectionObserver(([e]) => { $("today").hidden = e.isIntersecting; }, { root: list }).observe(nextRow);
  $("today").onclick = () => nextRow.scrollIntoView({ block: "center", behavior: "smooth" });
  $("close").onclick = () => $("all").close();
  $("all").onclick = e => { if (e.target === $("all")) $("all").close(); }; // click on backdrop closes

  function tick() {
    const now = new Date();
    if (now >= NEXT) { document.querySelector(".count").textContent = "🎉 It's Thanksgivukkah! 🎉"; return; }
    // whole calendar years first, then the remainder in days/h/m/s
    let y = NEXT.getFullYear() - now.getFullYear();
    const shifted = new Date(now); shifted.setFullYear(now.getFullYear() + y);
    if (shifted > NEXT) { y--; shifted.setFullYear(now.getFullYear() + y); }
    let r = Math.floor((NEXT - shifted) / 1000);
    const d = Math.floor(r / 86400); r %= 86400;
    $("y").textContent = y; $("d").textContent = d;
    $("h").textContent = Math.floor(r / 3600); $("m").textContent = Math.floor(r % 3600 / 60);
    const s = $("s"); s.textContent = r % 60; s.classList.remove("tick"); void s.offsetWidth; s.classList.add("tick");
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
